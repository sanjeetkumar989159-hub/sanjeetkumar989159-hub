
name: LeetCode Profile Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  leetcode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator
        run: python -m pip install --upgrade leetcode-profile-generator

      - name: Generate dashboard
        run: |
          leetcode-profile \
            --username sanjeet1234 \
            --theme github_dark \
            --output ./assets \
            --no-cache \
            --dashboard \
            --stats \
            --rating \
            --difficulty \
            --heatmap \
            --streak \
            --contest-history \
            --badges \
            --verbose

      - name: Verify generated files
        run: |
          ls -lah assets
          test -s assets/dashboard.svg
          test -s assets/leetcode_stats.svg
          test -s assets/heatmap.svg
          test -s assets/badges.svg

      - name: Commit generated cards
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update LeetCode dashboard"
