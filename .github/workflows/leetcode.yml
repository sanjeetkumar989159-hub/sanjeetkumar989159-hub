
name: LeetCode Profile Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  leetcode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator
        run: pip install leetcode-profile-generator

      - name: Generate all LeetCode cards
        run: |
          leetcode-profile \
            --username sanjeet1234 \
            --theme github_dark \
            --output ./assets \
            --no-cache \
            --dashboard \
            --stats \
            --heatmap \
            --badges \
            --streak \
            --rating \
            --difficulty \
            --contest-history \
            --verbose

      - name: Commit generated cards
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update LeetCode dashboard"
