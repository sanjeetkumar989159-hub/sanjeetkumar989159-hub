name: LeetCode Profile Dashboard
 
on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
 
permissions:
  contents: write
 
concurrency:
  group: leetcode-dashboard
  cancel-in-progress: true
 
jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Generate LeetCode progress card and badges
        run: |
          mkdir -p assets
          cat > "$RUNNER_TEMP/generate_dashboard.py" <<'PY'
          import base64
          import json
          import math
          import time
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from html import escape
          from pathlib import Path
 
          USER = "sanjeet1234"
          OUT = Path("assets")
          OUT.mkdir(exist_ok=True)
          UA = {"User-Agent": "Mozilla/5.0"}
          FONT = ("'JetBrains Mono','SFMono-Regular',Consolas,"
                  "'Liberation Mono',Menlo,monospace")
 
 
          # ---------- helpers ----------
          def http(url, data=None, headers=None, retries=3, timeout=40):
              h = dict(UA)
              h.update(headers or {})
              last = None
              for i in range(retries):
                  try:
                      req = urllib.request.Request(url, data=data, headers=h)
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          return r.read()
                  except Exception as e:
                      last = e
                      print(f"Attempt {i + 1} failed for {url}: {e}")
                      time.sleep(2 * (i + 1))
              raise last
 
 
          def gql(query, variables=None):
              payload = json.dumps(
                  {"query": query, "variables": variables or {}}
              ).encode()
              body = http(
                  "https://leetcode.com/graphql",
                  data=payload,
                  headers={
                      "Content-Type": "application/json",
                      "Referer": f"https://leetcode.com/u/{USER}/",
                  },
                  retries=2,
                  timeout=25,
              )
              return json.loads(body).get("data") or {}
 
 
          def sniff_mime(raw):
              if raw.startswith(b"\x89PNG"):
                  return "image/png"
              if raw.startswith(b"\xff\xd8"):
                  return "image/jpeg"
              if raw.startswith(b"GIF8"):
                  return "image/gif"
              if raw[:4] == b"RIFF" and raw[8:12] == b"WEBP":
                  return "image/webp"
              if raw.lstrip()[:5] in (b"<svg ", b"<?xml"):
                  return "image/svg+xml"
              return None
 
 
          def abs_url(u):
              if u and u.startswith("/"):
                  return "https://leetcode.com" + u
              return u
 
 
          def svg_doc(content, width, height):
              return (
                  f'<svg xmlns="http://www.w3.org/2000/svg" '
                  f'xmlns:xlink="http://www.w3.org/1999/xlink" '
                  f'width="{width}" height="{height}" '
                  f'viewBox="0 0 {width} {height}">'
                  f'<rect x="0.5" y="0.5" width="{width - 1}" '
                  f'height="{height - 1}" rx="14" fill="#0d1117" '
                  f'stroke="#30363d"/>{content}</svg>'
              )
 
 
          def txt(x, y, value, size=14, color="#e6edf3",
                  weight="normal", anchor="start"):
              return (
                  f'<text x="{x}" y="{y}" fill="{color}" '
                  f'font-family="{FONT}" font-size="{size}" '
                  f'font-weight="{weight}" text-anchor="{anchor}">'
                  f'{escape(str(value))}</text>'
              )
 
 
          def rect(x, y, w, h, fill, rx=0, extra=""):
              return (
                  f'<rect x="{x:.2f}" y="{y:.2f}" width="{w:.2f}" '
                  f'height="{h:.2f}" rx="{rx}" fill="{fill}" {extra}/>'
              )
 
 
          # ---------- fetch stats ----------
          data = json.loads(http(f"https://leetcode-stats.tashif.codes/{USER}"))
          if data.get("status") != "success":
              raise RuntimeError(f"API did not return success: {data}")
 
          solved = int(data["totalSolved"])
          easy = int(data["easySolved"])
          medium = int(data["mediumSolved"])
          hard = int(data["hardSolved"])
          calendar = data.get("submissionCalendar") or {}
          api_badges = int((data.get("data") or {}).get("badgesCount") or 0)
 
          # ---------- total questions per difficulty ----------
          t_easy = int(data.get("totalEasy") or 0)
          t_med = int(data.get("totalMedium") or 0)
          t_hard = int(data.get("totalHard") or 0)
          if not (t_easy and t_med and t_hard):
              try:
                  counts = gql("{allQuestionsCount{difficulty count}}")
                  m = {x["difficulty"]: int(x["count"])
                       for x in counts.get("allQuestionsCount") or []}
                  t_easy = m.get("Easy", 0)
                  t_med = m.get("Medium", 0)
                  t_hard = m.get("Hard", 0)
              except Exception as e:
                  print(f"Total question counts failed: {e}")
          if not (t_easy and t_med and t_hard):
              t_easy, t_med, t_hard = 900, 1900, 850  # rough fallback
              print("Using fallback totals")
          t_all = t_easy + t_med + t_hard
 
          # ---------- badges (animated gif when available) ----------
          Q_FULL = ("query($u:String!){matchedUser(username:$u){badges{id "
                    "displayName icon creationDate medal{slug config"
                    "{iconGif iconGifBackground}}}}}")
          Q_SIMPLE = ("query($u:String!){matchedUser(username:$u){badges{id "
                      "displayName icon creationDate}}}")
 
 
          def load_image(urls):
              for u in urls:
                  u = abs_url(u)
                  if not u or not u.startswith("http"):
                      continue
                  try:
                      img = http(u, retries=2, timeout=25)
                      mime = sniff_mime(img)
                      if mime and len(img) < 800_000:
                          return (f"data:{mime};base64,"
                                  + base64.b64encode(img).decode())
                  except Exception as e:
                      print(f"Badge image failed ({u}): {e}")
              return None
 
 
          def fetch_badges():
              raw = None
              for q in (Q_FULL, Q_SIMPLE):
                  try:
                      user = gql(q, {"u": USER}).get("matchedUser") or {}
                      if user.get("badges") is not None:
                          raw = user["badges"]
                          break
                  except Exception as e:
                      print(f"Badge query failed: {e}")
              items = []
              for b in raw or []:
                  medal = b.get("medal") or {}
                  gif = (medal.get("config") or {}).get("iconGif")
                  uri = load_image([gif, b.get("icon")])
                  items.append(
                      {"name": b.get("displayName") or "Badge", "uri": uri}
                  )
              return items
 
 
          try:
              badge_items = fetch_badges()
          except Exception as e:
              print(f"Badge fetch failed: {e}")
              badge_items = []
          badge_count = len(badge_items) if badge_items else api_badges
 
          # ---------- heatmap data (last 52 weeks) ----------
          today = datetime.now(timezone.utc).date()
          week_start = today - timedelta(days=(today.weekday() + 1) % 7)
          grid_start = week_start - timedelta(weeks=51)
          day_counts = {}
          for ts, cnt in calendar.items():
              d = datetime.fromtimestamp(int(ts), timezone.utc).date()
              day_counts[d] = day_counts.get(d, 0) + int(cnt)
 
 
          def level_color(n):
              if n == 0:
                  return "#161b22"
              if n < 3:
                  return "#0e4429"
              if n < 6:
                  return "#006d32"
              if n < 10:
                  return "#26a641"
              return "#39d353"
 
 
          # ---------- progress card ----------
          W = 600
          c = []
 
          # logo + username
          c.append('<path d="M34 22 L24 33 L34 44" stroke="#ffa116" '
                   'stroke-width="4" fill="none" stroke-linecap="round" '
                   'stroke-linejoin="round"/>')
          c.append('<path d="M38 43 H50" stroke="#8b949e" stroke-width="4" '
                   'stroke-linecap="round"/>')
          c.append(txt(62, 40, USER, 20, "#f0f6fc", "bold"))
 
          # ring
          cx, cy, r = 80, 128, 42
          circ = 2 * math.pi * r
          frac = min(max(solved / max(t_all, 1), 0.02), 1)
          c.append(f'<circle cx="{cx}" cy="{cy}" r="{r}" fill="none" '
                   f'stroke="#30363d" stroke-width="6"/>')
          c.append(f'<circle cx="{cx}" cy="{cy}" r="{r}" fill="none" '
                   f'stroke="#ffa116" stroke-width="6" '
                   f'stroke-linecap="round" '
                   f'stroke-dasharray="{circ * frac:.2f} {circ:.2f}" '
                   f'transform="rotate(-90 {cx} {cy})"/>')
          c.append(txt(cx, cy + 10, solved, 28, "#f0f6fc", "bold", "middle"))
 
          # difficulty bars
          bar_x, bar_w = 150, 426
          rows = [
              ("Easy", easy, t_easy, "#4cd964"),
              ("Medium", medium, t_med, "#ffa116"),
              ("Hard", hard, t_hard, "#ff375f"),
          ]
          for i, (label, got, tot, color) in enumerate(rows):
              y = 98 + i * 33
              c.append(txt(bar_x, y, label, 14, "#f0f6fc", "bold"))
              c.append(txt(bar_x + bar_w, y, f"{got} / {tot}", 13,
                           "#c9d1d9", anchor="end"))
              c.append(rect(bar_x, y + 8, bar_w, 4, "#30363d", 2))
              if got:
                  fw = max(bar_w * got / max(tot, 1), 4)
                  c.append(rect(bar_x, y + 8, fw, 4, color, 2))
 
          # separator
          c.append(f'<line x1="0" y1="190" x2="{W}" y2="190" '
                   f'stroke="#30363d"/>')
 
          # heatmap
          total = 0
          step = 560 / 52
          cell = 9
          x0, y0 = 20, 224
          cells = []
          for col in range(52):
              for row in range(7):
                  d = grid_start + timedelta(days=col * 7 + row)
                  if d > today:
                      continue
                  n = day_counts.get(d, 0)
                  total += n
                  cells.append(
                      f'<rect x="{x0 + col * step:.2f}" '
                      f'y="{y0 + row * step:.2f}" width="{cell}" '
                      f'height="{cell}" rx="2" fill="{level_color(n)}">'
                      f'<title>{d}: {n} submissions</title></rect>'
                  )
          c.append(txt(20, 210, "Heatmap (Last 52 Weeks)", 13, "#c9d1d9"))
          c.append(txt(580, 210, f"{total} submissions", 12, "#8b949e",
                       anchor="end"))
          c.extend(cells)
          fy = y0 + 6 * step + cell + 20
          c.append(txt(20, fy, grid_start.strftime("%Y.%m.%d"), 10,
                       "#c9d1d9", "bold"))
          c.append(txt(580, fy, today.strftime("%Y.%m.%d"), 10,
                       "#c9d1d9", "bold", "end"))
 
          (OUT / "progress.svg").write_text(
              svg_doc("".join(c), W, int(fy + 18)), encoding="utf-8"
          )
 
          # ---------- badges card ----------
          c = [txt(24, 36, "Badges", 16, "#f0f6fc", "bold"),
               txt(576, 36, f"{badge_count} earned", 13, "#ffa116", "bold",
                   "end")]
          if badge_items:
              tile_w, tile_h, gap, per_row = 130, 150, 10, 4
              rows_n = math.ceil(len(badge_items) / per_row)
              for ri in range(rows_n):
                  chunk = badge_items[ri * per_row:(ri + 1) * per_row]
                  row_w = len(chunk) * tile_w + (len(chunk) - 1) * gap
                  sx = (W - row_w) / 2
                  ty = 56 + ri * (tile_h + gap)
                  for ci, b in enumerate(chunk):
                      tx = sx + ci * (tile_w + gap)
                      c.append(rect(tx, ty, tile_w, tile_h, "#0d1117", 8,
                                    'stroke="#30363d"'))
                      if b["uri"]:
                          c.append(
                              f'<image x="{tx + 21:.2f}" y="{ty + 14}" '
                              f'width="88" height="88" '
                              f'xlink:href="{b["uri"]}"/>'
                          )
                      else:
                          c.append(txt(tx + tile_w / 2, ty + 78, "\U0001F3C5",
                                       40, anchor="middle"))
                      name = b["name"]
                      if len(name) > 17:
                          name = name[:16] + "\u2026"
                      c.append(txt(tx + tile_w / 2, ty + 132, name, 11,
                                   "#c9d1d9", "bold", "middle"))
              height = 56 + rows_n * (tile_h + gap) + 6
          else:
              c.append(txt(24, 100, badge_count, 40, "#ffa116", "bold"))
              c.append(txt(24, 130, "Badges earned on LeetCode", 13,
                           "#8b949e"))
              height = 160
          (OUT / "badges.svg").write_text(
              svg_doc("".join(c), W, height), encoding="utf-8"
          )
 
          # ---------- validate ----------
          for name in ("progress.svg", "badges.svg"):
              p = OUT / name
              if not p.exists() or p.stat().st_size == 0:
                  raise RuntimeError(f"Failed to generate {p}")
              print(f"Generated {p} ({p.stat().st_size} bytes)")
          print(f"Solved {solved} ({easy}/{medium}/{hard}) of {t_all} | "
                f"Badges {badge_count} | Submissions(52w) {total}")
          PY
 
          python "$RUNNER_TEMP/generate_dashboard.py"
 
      - name: Commit updated dashboard
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update LeetCode dashboard"
          file_pattern: "assets/*.svg"
 
