<text x="450" y="130" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#22D3EE" opacity="0">"The best error message is the one that never shows up"<animate attributeName="opacity" values="1;1;1;0;0" keyTimes="0;0.03;0.220;0.250;1" dur="16s" repeatCount="indefinite"/></text>
<text x="450" y="130" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#22D3EE" opacity="0">"First make it work, then make it right"<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.280;0.470;0.500;1" dur="16s" repeatCount="indefinite"/></text>
<text x="450" y="130" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#22D3EE" opacity="0">"Every expert was once a beginner"<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.530;0.720;0.750;1" dur="16s" repeatCount="indefinite"/></text>
<text x="450" y="130" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#22D3EE" opacity="0">"Code is read more than it is written"<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.750;0.780;0.970;1.000;1" dur="16s" repeatCount="indefinite"/></text>
<line x1="40" y1="154" x2="860" y2="154" stroke="#1E2A44"/>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.60s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="-14 0;0 0" dur="0.5s" begin="0.60s" fill="freeze"/><rect x="40" y="172" width="4" height="28" rx="2" fill="#22D3EE"/><text x="58" y="192" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#F4F7FB" >Problem-first thinking before writing code</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.85s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="-14 0;0 0" dur="0.5s" begin="0.85s" fill="freeze"/><rect x="470" y="172" width="4" height="28" rx="2" fill="#A78BFA"/><text x="488" y="192" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#F4F7FB" >Learn → Build → Break → Fix → Repeat</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.10s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="-14 0;0 0" dur="0.5s" begin="1.10s" fill="freeze"/><rect x="40" y="216" width="4" height="28" rx="2" fill="#34D399"/><text x="58" y="236" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#F4F7FB" >Collaboration accelerates growth</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.35s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="-14 0;0 0" dur="0.5s" begin="1.35s" fill="freeze"/><rect x="470" y="216" width="4" height="28" rx="2" fill="#F0A868"/><text x="488" y="236" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#F4F7FB" >Document your code, future-you will thank you</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.60s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="-14 0;0 0" dur="0.5s" begin="1.60s" fill="freeze"/><rect x="40" y="260" width="4" height="28" rx="2" fill="#7FC4FF"/><text x="58" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#F4F7FB" >Refactor ruthlessly, ship consistently</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.85s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="-14 0;0 0" dur="0.5s" begin="1.85s" fill="freeze"/><rect x="470" y="260" width="4" height="28" rx="2" fill="#FBBF24"/><text x="488" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#F4F7FB" >Progress over perfection, always</text></g>
