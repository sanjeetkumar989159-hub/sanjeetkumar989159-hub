<svg width="900" height="332" viewBox="0 0 900 332" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DEVELOPER MINDSET" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
